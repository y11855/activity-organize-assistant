server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: activity-assistant
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 上传文件存储目录
# 本地开发默认 uploads/（相对启动目录）；部署到外部 Tomcat 时用环境变量 UPLOAD_DIR 指定绝对路径，
# 两个 Tomcat 实例必须指向同一个目录，否则 A 实例上传的图片 B 实例读不到
app:
  upload-dir: ${UPLOAD_DIR:uploads}

# 业务配置
activity-assistant:
  ai:
    # provider: ollama | openai | qwen
    provider: qwen
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
      timeout: 60000
    qwen:
      api-key: ${DASHSCOPE_API_KEY:}
      model: qwen-plus
      timeout: 60000
    ollama:
      base-url: http://localhost:11434
      model: qwen2.5:7b
  tool:
    # 工具调用失败重试次数
    retry-count: 3
    # 重试间隔（毫秒）
    retry-interval: 1000
  reminder:
    # 默认提前提醒时间（分钟）
    default-advance-minutes: 30

# Swagger
knife4j:
  enable: true
  setting:
    language: zh_cn
