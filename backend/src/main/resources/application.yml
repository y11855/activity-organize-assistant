server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: activity-assistant
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  # 邮箱验证码登录（QQ 邮箱示例：smtp.qq.com:465 SSL，password 填邮箱授权码）
  # 账号通过环境变量 MAIL_USERNAME / MAIL_PASSWORD 注入（见 start.local.ps1）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 上传文件存储目录
# 本地开发默认 uploads/（相对启动目录）；部署到外部 Tomcat 时用环境变量 UPLOAD_DIR 指定绝对路径，
# 两个 Tomcat 实例必须指向同一个目录，否则 A 实例上传的图片 B 实例读不到
app:
  upload-dir: ${UPLOAD_DIR:uploads}
  # 分片大小（字节）：大文件按此切分，默认 2MB
  chunk-size: 2097152
  # 单个小文件直传上限（字节），默认 5MB；超过则走分片上传
  direct-max-size: 5242880
  # 分片上传允许的最大文件（字节），默认 1GB
  max-file-size: 1073741824

# 业务配置
activity-assistant:
  ai:
    # provider: ollama | openai | qwen
    provider: qwen
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
      timeout: 60000
    qwen:
      api-key: ${DASHSCOPE_API_KEY:}
      model: qwen-plus
      timeout: 60000
    ollama:
      base-url: http://localhost:11434
      model: qwen2.5:7b
  tool:
    # 工具调用失败重试次数
    retry-count: 3
    # 重试间隔（毫秒）
    retry-interval: 1000
  reminder:
    # 默认提前提醒时间（分钟）
    default-advance-minutes: 30

# Swagger
knife4j:
  enable: true
  setting:
    language: zh_cn
