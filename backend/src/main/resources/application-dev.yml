spring:
  datasource:
    # 使用 Druid 连接池
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/activity_assistant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:ENC(FLhAnwlnj4ouxPlaiRQTiDEE3pofHfs6+a0zd5aUVlFYmcmgE4Ip7706XbQrdrC1)}
    druid:
      # —— 连接池大小 ——
      initial-size: 5          # 初始化连接数
      min-idle: 10            # 最小空闲连接
      max-active: 20           # 最大活跃连接
      max-wait: 60000          # 获取连接最大等待毫秒
      # —— 连接保活与检测 ——
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000   # 空闲连接检测间隔
      min-evictable-idle-time-millis: 300000     # 连接最小空闲时间
      # —— 监控统计 ——
      filters: stat,wall       # stat: SQL 监控统计；wall: SQL 防火墙
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000  # 慢 SQL 阈值 1s
          merge-sql: true
        wall:
          enabled: true
      # —— Druid 监控页面：/api/druid ——
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USER:admin}
        login-password: ${DRUID_PASSWORD:ENC(Zlar6hw7spjxlcLeyfXNisFKYnVs8f8chGR6prNVMCQmxmkheiULmxGjsAFVYCtY)}
        reset-enable: false
      # —— Web 请求与 SQL 关联监控 ——
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: '*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*'
      aop-patterns: com.aiapp.activityassistant.service.*,com.aiapp.activityassistant.tool.*
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

logging:
  level:
    com.aiapp.activityassistant: debug

# —— 配置加密（Jasypt）——
# yml 中所有 ENC(...) 包裹的值会在启动时用主密钥解密。
# 主密钥 MUST 通过环境变量 JASYPT_ENCRYPTOR_PASSWORD 传入，禁止写入任何配置/源码文件。
jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    string-output-type: base64
    password: ${JASYPT_ENCRYPTOR_PASSWORD:}
